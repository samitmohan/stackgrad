# uv run --extra docs mkdocs serve
site_name: stackgrad docs
site_url: https://samitmohan.github.io/stackgrad/
repo_url: https://github.com/samitmohan/stackgrad/
edit_uri: edit/master/docs
nav:
- Home:
  - index.md
  - Quickstart: quickstart.md
  - Showcase: showcase.md
  - Study plan: guide.md
  - API Reference:
    - Tensor:
      - tensor/index.md
      - Properties: tensor/properties.md
      - Movement: tensor/movement.md
      - Elementwise: tensor/elementwise.md
      - Reduce and Autograd: tensor/ops.md
    - nn (Neural Networks): nn.md
    - Runtime: runtime.md
  - Developer: developer.md

validation:
  links:
    anchors: warn

markdown_extensions:
- attr_list
- admonition
- pymdownx.highlight:
    pygments_lang_class: true
- pymdownx.inlinehilite
- pymdownx.superfences
- toc:
    permalink: "¤"

theme:
  name: material
  logo: logo_dark.svg
  favicon: favicon.svg
  features:
  - content.action.edit
  - content.code.copy
  - navigation.footer
  - navigation.indexes
  - navigation.sections
  - navigation.expand
  - navigation.top
  - navigation.path
  - search.highlight
  - search.suggest
  - toc.follow
  - toc.integrate
  palette:
    - media: "(prefers-color-scheme)"
      accent: lime
      primary: black
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      accent: lime
      primary: black
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      accent: lime
      primary: black
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
plugins:
- search
- mkdocstrings:
    handlers:
      python:
        paths: [.]
        options:
          docstring_section_style: list
          filters: ["!^_"]
          heading_level: 3
          inherited_members: false
          merge_init_into_class: true
          separate_signature: true
          show_root_heading: true
          show_root_full_path: false
          show_symbol_type_heading: true
          show_symbol_type_toc: true
          show_source: true
          summary: true
